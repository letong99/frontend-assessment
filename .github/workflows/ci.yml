name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run lint, typecheck, and tests
        run: npm run check

      - name: Build production bundle
        run: npm run build

      - name: Verify mock service worker artifact
        run: test -s dist/mockServiceWorker.js

      - name: Upload production bundle
        uses: actions/upload-artifact@v4
        with:
          name: meridian-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7
